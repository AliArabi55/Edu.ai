<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أزرار التنقل التفاعلية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 1000px;
            width: 100%;
        }

        .title {
            font-size: 2.5rem;
            color: #2d3748;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .subtitle {
            color: #718096;
            font-size: 1.2rem;
            margin-bottom: 40px;
        }

        /* كلاس الزر الأساسي */
        .btn {
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px 30px;
            margin: 8px;
            border: none;
            border-radius: 15px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            outline: none;
        }

        /* تأثيرات التفاعل - فقط على الأزرار */
        .btn:hover {
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0) scale(0.98);
        }

        .btn:focus {
            box-shadow: 0 0 0 4px rgba(66, 153, 225, 0.3);
        }

        /* ألوان مختلفة للأزرار */
        .btn-blue { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .btn-green { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .btn-purple { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .btn-orange { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .btn-teal { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .btn-red { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        .btn-gray { background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); }
        .btn-yellow { background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%); }
        .btn-indigo { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .btn-pink { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }

        /* أزرار رئيسية كبيرة */
        .btn-main {
            padding: 20px 40px;
            font-size: 20px;
            margin: 15px;
        }

        /* أزرار الاتجاهات متوسطة */
        .btn-direction {
            padding: 12px 25px;
            font-size: 16px;
        }

        /* أزرار صغيرة */
        .btn-small {
            padding: 10px 20px;
            font-size: 14px;
        }

        /* تخطيط الأزرار */
        .main-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .direction-buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 40px;
        }

        .direction-row {
            display: flex;
            gap: 20px;
        }

        .other-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
        }

        /* الأيقونات */
        .icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .icon-small {
            width: 16px;
            height: 16px;
        }

        /* تأثير الموجة */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0);
            animation: ripple 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        .instructions {
            margin-top: 40px;
            color: #718096;
            font-size: 14px;
        }

        /* تحسينات للجوال */
        @media (max-width: 768px) {
            .title {
                font-size: 2rem;
            }
            
            .btn-main {
                padding: 15px 25px;
                font-size: 16px;
            }
            
            .main-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .direction-row {
                flex-direction: column;
                align-items: center;
            }
            
            .other-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- العنوان -->
        <h1 class="title">أزرار التنقل التفاعلية</h1>
        <p class="subtitle">تفاعلية فقط على الأزرار - بدون تأثيرات على الشاشة 🎯</p>

        <!-- الأزرار الرئيسية -->
        <div class="main-buttons">
            <button class="btn btn-blue btn-main" onclick="handleClick('السابق', this)">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
                السابق
            </button>
            
            <button class="btn btn-green btn-main" onclick="handleClick('التالي', this)">
                التالي
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                </svg>
            </button>
        </div>

        <!-- أزرار الاتجاهات -->
        <div class="direction-buttons">
            <button class="btn btn-purple btn-direction" onclick="handleClick('لأعلى', this)">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/>
                </svg>
                لأعلى
            </button>
            
            <div class="direction-row">
                <button class="btn btn-orange btn-direction" onclick="handleClick('لليسار', this)">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                    يسار
                </button>
                
                <button class="btn btn-teal btn-direction" onclick="handleClick('لليمين', this)">
                    يمين
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                </button>
            </div>
            
            <button class="btn btn-red btn-direction" onclick="handleClick('لأسفل', this)">
                لأسفل
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                </svg>
            </button>
        </div>

        <!-- أزرار إضافية -->
        <div class="other-buttons">
            <button class="btn btn-gray btn-small" onclick="handleClick('الرئيسية', this)">
                <svg class="icon icon-small" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                </svg>
                الرئيسية
            </button>
            
            <button class="btn btn-yellow btn-small" onclick="handleClick('الإعدادات', this)">
                <svg class="icon icon-small" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
                الإعدادات
            </button>
            
            <button class="btn btn-indigo btn-small" onclick="handleClick('المساعدة', this)">
                <svg class="icon icon-small" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                المساعدة
            </button>
            
            <button class="btn btn-pink btn-small" onclick="handleClick('الخروج', this)">
                <svg class="icon icon-small" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                </svg>
                الخروج
            </button>
        </div>

        <!-- تعليمات الاستخدام -->
        <div class="instructions">
            الأزرار تفاعلية فقط - بدون تأثيرات على الشاشة 🎯
        </div>
    </div>

    <script>
        // دالة إضافة تأثير الموجة
        function addRippleEffect(button, event) {
            const rect = button.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = event.clientX - rect.left - size / 2;
            const y = event.clientY - rect.top - size / 2;

            const ripple = document.createElement('span');
            ripple.classList.add('ripple');
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';

            button.appendChild(ripple);

            // إزالة التأثير بعد انتهاء الانيميشن
            setTimeout(() => {
                if (ripple.parentNode) {
                    ripple.parentNode.removeChild(ripple);
                }
            }, 600);
        }

        // دالة التعامل مع النقر
        function handleClick(direction, button) {
            // إضافة تأثير الموجة
            addRippleEffect(button, event);
            
            // تسجيل النقرة
            console.log(`تم النقر على زر: ${direction}`);
            
            // يمكن إضافة المزيد من الوظائف هنا
            // مثل التنقل بين الصفحات أو تنفيذ أوامر معينة
            
            // إضافة تأثير بصري مؤقت
            button.style.transform = 'scale(0.95)';
            setTimeout(() => {
                button.style.transform = '';
            }, 150);
        }

        // إضافة مستمعات الأحداث لكل الأزرار
        document.addEventListener('DOMContentLoaded', function() {
            const buttons = document.querySelectorAll('.btn');
            
            buttons.forEach(button => {
                // تأثير إضافي عند التمرير
                button.addEventListener('mouseenter', function() {
                    this.style.transform = 'translateY(-3px)';
                });
                
                button.addEventListener('mouseleave', function() {
                    this.style.transform = '';
                });
                
                // تأثير النقر
                button.addEventListener('click', function(event) {
                    addRippleEffect(this, event);
                });
            });
        });
    </script>
</body>
</html>
